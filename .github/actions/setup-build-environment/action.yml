name: Setup Build Environment
runs:
  using: "composite"
  steps:

    - name: Init Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
        key: ${{ runner.os }}-pio

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      shell: bash
      run: |
        pip install --upgrade platformio

    # Extract version from tag: "companion-v1.2.3" -> "v1.2.3", "room-server-v1.14.0-fork.2" -> "v1.14.0-fork.2"
    - name: Extract Version from Git Tag
      shell: bash
      run: |
        GIT_TAG_NAME="${GITHUB_REF#refs/tags/}"
        GIT_TAG_VERSION=$(echo "$GIT_TAG_NAME" | sed 's/^[^v]*//')
        echo "GIT_TAG_VERSION=${GIT_TAG_VERSION}" >> $GITHUB_ENV
